[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

# Settings shared by every crate in the workspace.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AymanBAHHOU/quran-island"

# Versions are declared once here; crates use `serde = { workspace = true }`.
[workspace.dependencies]
quran-core = { path = "crates/quran-core" }
quran-data = { path = "crates/quran-data" }
quran-audio = { path = "crates/quran-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
